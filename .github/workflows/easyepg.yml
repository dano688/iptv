name: Weekly EasyEPG

on:
  workflow_dispatch:
  schedule:
    # Monday 12:15 CEST / 11:15 CET.
    - cron: "15 10 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-easyepg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out EPG repository
        uses: actions/checkout@v4

      - name: Check out pinned EasyEPG source
        uses: actions/checkout@v4
        with:
          repository: sunsettrack4/script.service.easyepg-lite
          ref: 836823d0ace717cbaa70ed3d7c874ca5de585fb3
          path: _easyepg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _easyepg/requirements.txt

      - name: Install EasyEPG dependencies
        run: python -m pip install --disable-pip-version-check -r _easyepg/requirements.txt

      - name: Restore encrypted EasyEPG configuration
        env:
          EASYEPG_SETTINGS_B64: ${{ secrets.EASYEPG_SETTINGS_B64 }}
          EASYEPG_PLAYLIST_B64: ${{ secrets.EASYEPG_PLAYLIST_B64 }}
        run: python .github/easyepg/restore_config.py _runtime

      - name: Preserve the complete XMLTV source range
        run: python .github/easyepg/patch_xmltv_provider.py _easyepg/resources/lib/providers/xmltv.py

      - name: Generate a fresh EPG
        run: python .github/easyepg/run_once.py --source _easyepg --storage _runtime --timeout 1500

      - name: Add TVRUS days only when IPTVX is late
        run: python .github/easyepg/tvrus_fallback.py _runtime/xml/epg.xml

      - name: Normalize and validate output
        run: python .github/easyepg/finalize.py _runtime/xml/epg.xml epg

      - name: Publish only a changed, valid EPG
        run: |
          if git diff --quiet -- epg; then
            echo "EPG is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg
          git commit -m "Update EPG: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
